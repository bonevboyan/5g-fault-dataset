# Override: run the registration-chain NFs with native-OTel binaries, exporting to Jaeger.
# Apply with:
#   docker compose -f docker-compose.yaml -f docker-compose-otel.yaml up -d nrf amf ausf udm udr
services:
  free5gc-nrf:
    image: free5gc/nrf:otel
    environment:
      GIN_MODE: release
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: "nrf"
  free5gc-amf:
    image: free5gc/amf:otel
    environment:
      GIN_MODE: release
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4317"
