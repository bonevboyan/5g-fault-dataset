{"apiVersion": "v1", "kind": "Service", "metadata": {"name": "chf", "namespace": "f5g"}, "spec": {"clusterIP": "None", "publishNotReadyAddresses": true, "selector": {"app": "chf"}, "ports": [{"name": "sbi", "port": 8000, "protocol": "TCP"}, {"name": "metrics", "port": 9091, "protocol": "TCP"}]}}
---
{"apiVersion": "apps/v1", "kind": "Deployment", "metadata": {"name": "chf", "namespace": "f5g", "labels": {"app": "chf", "tier": "core"}}, "spec": {"replicas": 1, "strategy": {"type": "Recreate"}, "selector": {"matchLabels": {"app": "chf"}}, "template": {"metadata": {"labels": {"app": "chf", "tier": "core"}, "annotations": {"f5g/scrape": "true", "f5g/metrics-port": "9091"}}, "spec": {"nodeSelector": {"role": "core"}, "volumes": [{"name": "cert", "emptyDir": {}}, {"name": "config", "emptyDir": {}}, {"name": "pki", "secret": {"secretName": "f5g-pki"}}, {"name": "cfg", "configMap": {"name": "f5g-config"}}], "containers": [{"name": "chf", "image": "free5gc/chf:otel2", "imagePullPolicy": "Never", "workingDir": "/free5gc", "command": ["sh", "-c", "cp /pki/* ./cert/ && sed \"s/POD_IP/$POD_IP/g\" /cfg/chfcfg.yaml > ./config/chfcfg.yaml && exec ./chf -c ./config/chfcfg.yaml "], "env": [{"name": "POD_IP", "valueFrom": {"fieldRef": {"fieldPath": "status.podIP"}}}, {"name": "GIN_MODE", "value": "release"}, {"name": "OTEL_SERVICE_NAME", "value": "chf"}, {"name": "SBI_TLS_CERT", "value": "/free5gc/cert/chf.pem"}, {"name": "SBI_TLS_KEY", "value": "/free5gc/cert/chf.key"}, {"name": "SBI_TLS_CA", "value": "/free5gc/cert/root.pem"}], "volumeMounts": [{"name": "cert", "mountPath": "/free5gc/cert"}, {"name": "config", "mountPath": "/free5gc/config"}, {"name": "pki", "mountPath": "/pki", "readOnly": true}, {"name": "cfg", "mountPath": "/cfg", "readOnly": true}], "readinessProbe": {"httpGet": {"path": "/metrics", "port": 9091}, "periodSeconds": 5, "failureThreshold": 3}, "livenessProbe": {"httpGet": {"path": "/metrics", "port": 9091}, "periodSeconds": 5, "failureThreshold": 3, "initialDelaySeconds": 10}}]}}}}