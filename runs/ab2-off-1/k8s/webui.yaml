{"apiVersion": "v1", "kind": "Service", "metadata": {"name": "webui", "namespace": "f5g"}, "spec": {"clusterIP": "None", "publishNotReadyAddresses": true, "selector": {"app": "webui"}, "ports": [{"name": "http", "port": 5000, "protocol": "TCP"}]}}
---
{"apiVersion": "apps/v1", "kind": "Deployment", "metadata": {"name": "webui", "namespace": "f5g", "labels": {"app": "webui", "tier": "core"}}, "spec": {"replicas": 1, "strategy": {"type": "Recreate"}, "selector": {"matchLabels": {"app": "webui"}}, "template": {"metadata": {"labels": {"app": "webui", "tier": "core"}, "annotations": {}}, "spec": {"nodeSelector": {"role": "core"}, "volumes": [{"name": "cert", "emptyDir": {}}, {"name": "config", "emptyDir": {}}, {"name": "pki", "secret": {"secretName": "f5g-pki"}}, {"name": "cfg", "configMap": {"name": "f5g-config"}}], "containers": [{"name": "webui", "image": "free5gc/webui:otel2", "imagePullPolicy": "Never", "workingDir": "/free5gc", "command": ["sh", "-c", "cp /pki/* ./cert/ && sed \"s/POD_IP/$POD_IP/g\" /cfg/webuicfg.yaml > ./config/webuicfg.yaml && exec ./webui -c ./config/webuicfg.yaml"], "env": [{"name": "POD_IP", "valueFrom": {"fieldRef": {"fieldPath": "status.podIP"}}}, {"name": "GIN_MODE", "value": "release"}, {"name": "OTEL_SERVICE_NAME", "value": "webui"}, {"name": "SBI_TLS_CERT", "value": "/free5gc/cert/webui.pem"}, {"name": "SBI_TLS_KEY", "value": "/free5gc/cert/webui.key"}, {"name": "SBI_TLS_CA", "value": "/free5gc/cert/root.pem"}], "volumeMounts": [{"name": "cert", "mountPath": "/free5gc/cert"}, {"name": "config", "mountPath": "/free5gc/config"}, {"name": "pki", "mountPath": "/pki", "readOnly": true}, {"name": "cfg", "mountPath": "/cfg", "readOnly": true}], "readinessProbe": {"tcpSocket": {"port": 5000}, "periodSeconds": 2}}]}}}}