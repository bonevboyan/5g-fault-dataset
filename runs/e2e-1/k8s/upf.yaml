{"apiVersion": "v1", "kind": "Service", "metadata": {"name": "upf", "namespace": "f5g"}, "spec": {"clusterIP": "None", "publishNotReadyAddresses": true, "selector": {"app": "upf"}, "ports": [{"name": "pfcp", "port": 8805, "protocol": "UDP"}, {"name": "gtpu", "port": 2152, "protocol": "UDP"}]}}
---
{"apiVersion": "apps/v1", "kind": "Deployment", "metadata": {"name": "upf", "namespace": "f5g", "labels": {"app": "upf", "tier": "core"}}, "spec": {"replicas": 1, "strategy": {"type": "Recreate"}, "selector": {"matchLabels": {"app": "upf"}}, "template": {"metadata": {"labels": {"app": "upf", "tier": "core"}, "annotations": {}}, "spec": {"nodeSelector": {"role": "core"}, "volumes": [{"name": "cert", "emptyDir": {}}, {"name": "config", "emptyDir": {}}, {"name": "pki", "secret": {"secretName": "f5g-pki"}}, {"name": "cfg", "configMap": {"name": "f5g-config"}}], "containers": [{"name": "upf", "image": "free5gc/upf:v4.2.3", "imagePullPolicy": "Never", "workingDir": "/free5gc", "command": ["bash", "-c", "until getent hosts upf >/dev/null; do sleep 0.5; done; cp /cfg/upf-iptables.sh ./upf-iptables.sh && sed \"s/POD_IP/$POD_IP/g\" /cfg/upfcfg.yaml > ./config/upfcfg.yaml && bash ./upf-iptables.sh && exec ./upf -c ./config/upfcfg.yaml"], "env": [{"name": "POD_IP", "valueFrom": {"fieldRef": {"fieldPath": "status.podIP"}}}], "securityContext": {"privileged": true}, "volumeMounts": [{"name": "cert", "mountPath": "/free5gc/cert"}, {"name": "config", "mountPath": "/free5gc/config"}, {"name": "pki", "mountPath": "/pki", "readOnly": true}, {"name": "cfg", "mountPath": "/cfg", "readOnly": true}]}, {"name": "dn", "image": "busybox:1.37", "imagePullPolicy": "Never", "command": ["sleep", "infinity"]}]}}}}