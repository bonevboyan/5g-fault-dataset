{"apiVersion": "v1", "kind": "ConfigMap", "metadata": {"name": "gnb-0-cfg", "namespace": "f5g"}, "data": {"gnbcfg.yaml": "mcc: \"208\" # Mobile Country Code value\nmnc: \"93\" # Mobile Network Code value (2 or 3 digits)\n\nnci: \"0x000000010\" # NR Cell Identity (36-bit), set per gNB by render.py\nidLength: 32 # NR gNB ID length in bits [22...32]\ntac: 1 # Tracking Area Code: one per gNB (gNB index + 1), set by render.py\n\nlinkIp: 127.0.0.1 # gNB's local IP address for Radio Link Simulation (Usually same with local IP)\nngapIp: POD_IP\ngtpIp: POD_IP\n\n# List of AMF address information\namfConfigs:\n  - address: amf\n    port: 38412\n\n# List of supported S-NSSAIs by this gNB\nslices:\n  - sst: 0x1\n    sd: 0x010203\n  - sst: 0x1\n    sd: 0x112233\n\n# Indicates whether or not SCTP stream number errors should be ignored.\nignoreStreamIds: true\n", "uecfg.yaml": "# IMSI number of the UE. IMSI = [MCC|MNC|MSISDN] (In total 15 digits)\nsupi: \"imsi-208930000000001\"\n# Mobile Country Code value of HPLMN\nmcc: \"208\"\n# Mobile Network Code value of HPLMN (2 or 3 digits)\nmnc: \"93\"\n\n# Permanent subscription key\nkey: \"8baf473f2f8fd09487cccbd7097c6862\"\n# Operator code (OP or OPC) of the UE\nop: \"8e27b6af0e692e750f32667a3b14605d\"\n# This value specifies the OP type and it can be either 'OP' or 'OPC'\nopType: \"OPC\"\n# Authentication Management Field (AMF) value\namf: \"8000\"\n# IMEI number of the device. It is used if no SUPI is provided\nimei: \"356938035643809\"\n# IMEISV number of the device. It is used if no SUPI and IMEI is provided\nimeiSv: \"4370816125816151\"\n\n# List of gNB IP addresses for Radio Link Simulation\ngnbSearchList:\n  - 127.0.0.1\n\n# UAC Access Identities Configuration\nuacAic:\n  mps: false\n  mcs: false\n\n# UAC Access Control Class\nuacAcc:\n  normalClass: 0\n  class11: false\n  class12: false\n  class13: false\n  class14: false\n  class15: false\n\n# Initial PDU sessions to be established\nsessions:\n  - type: \"IPv4\"\n    apn: \"internet\"\n    slice:\n      sst: 0x01\n      sd: 0x010203\n  - type: \"IPv4\"\n    apn: \"internet\"\n    slice:\n      sst: 0x01\n      sd: 0x112233\n\n# Configured NSSAI for this UE by HPLMN\nconfigured-nssai:\n  - sst: 0x01\n    sd: 0x010203\n  - sst: 0x01\n    sd: 0x112233\n\n# Default Configured NSSAI for this UE\ndefault-nssai:\n  - sst: 1\n    sd: 1\n\n# Supported integrity algorithms by this UE\nintegrity:\n  IA1: true\n  IA2: true\n  IA3: true\n\n# Supported encryption algorithms by this UE\nciphering:\n  EA1: true\n  EA2: true\n  EA3: true\n\n# Integrity protection maximum data rate for user plane\nintegrityMaxRate:\n  uplink: \"full\"\n  downlink: \"full\"\n"}}
---
{"apiVersion": "apps/v1", "kind": "Deployment", "metadata": {"name": "gnb-0", "namespace": "f5g", "labels": {"app": "gnb-0", "tier": "ran", "gnb": "0"}}, "spec": {"replicas": 1, "strategy": {"type": "Recreate"}, "selector": {"matchLabels": {"app": "gnb-0"}}, "template": {"metadata": {"labels": {"app": "gnb-0", "tier": "ran", "gnb": "0"}, "annotations": {}}, "spec": {"nodeSelector": {"role": "ran"}, "volumes": [{"name": "cfg", "configMap": {"name": "gnb-0-cfg"}}, {"name": "config", "emptyDir": {}}, {"name": "tun", "hostPath": {"path": "/dev/net/tun"}}], "containers": [{"name": "ueransim", "image": "free5gc/ueransim:latest", "imagePullPolicy": "Never", "workingDir": "/ueransim", "command": ["sh", "-c", "sysctl -qw net.ipv6.conf.all.disable_ipv6=1 net.ipv6.conf.default.disable_ipv6=1 && sed \"s/POD_IP/$POD_IP/g\" /cfg/gnbcfg.yaml > ./config/gnbcfg.yaml && cp /cfg/uecfg.yaml ./config/ && exec ./nr-gnb -c ./config/gnbcfg.yaml"], "env": [{"name": "POD_IP", "valueFrom": {"fieldRef": {"fieldPath": "status.podIP"}}}], "securityContext": {"privileged": true}, "volumeMounts": [{"name": "cfg", "mountPath": "/cfg", "readOnly": true}, {"name": "config", "mountPath": "/ueransim/config"}, {"name": "tun", "mountPath": "/dev/net/tun"}]}]}}}}