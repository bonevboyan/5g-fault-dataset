{"apiVersion": "v1", "kind": "Service", "metadata": {"name": "db", "namespace": "f5g"}, "spec": {"clusterIP": "None", "publishNotReadyAddresses": true, "selector": {"app": "db"}, "ports": [{"name": "mongo", "port": 27017, "protocol": "TCP"}]}}
