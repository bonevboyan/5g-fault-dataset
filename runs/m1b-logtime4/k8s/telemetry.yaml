{"apiVersion": "v1", "kind": "Namespace", "metadata": {"name": "f5g-telemetry"}}
---
{"apiVersion": "v1", "kind": "ServiceAccount", "metadata": {"name": "otel", "namespace": "f5g-telemetry"}}
---
{"apiVersion": "rbac.authorization.k8s.io/v1", "kind": "ClusterRole", "metadata": {"name": "f5g-otel"}, "rules": [{"apiGroups": [""], "resources": ["pods", "nodes", "nodes/stats", "nodes/metrics", "nodes/proxy", "namespaces", "events", "services", "endpoints", "replicationcontrollers", "resourcequotas", "persistentvolumes", "persistentvolumeclaims"], "verbs": ["get", "list", "watch"]}, {"apiGroups": ["apps"], "resources": ["deployments", "replicasets", "daemonsets", "statefulsets"], "verbs": ["get", "list", "watch"]}, {"apiGroups": ["batch"], "resources": ["jobs", "cronjobs"], "verbs": ["get", "list", "watch"]}, {"apiGroups": ["autoscaling"], "resources": ["horizontalpodautoscalers"], "verbs": ["get", "list", "watch"]}, {"apiGroups": ["events.k8s.io"], "resources": ["events"], "verbs": ["get", "list", "watch"]}, {"nonResourceURLs": ["/metrics", "/metrics/cadvisor"], "verbs": ["get"]}]}
---
{"apiVersion": "rbac.authorization.k8s.io/v1", "kind": "ClusterRoleBinding", "metadata": {"name": "f5g-otel"}, "roleRef": {"apiGroup": "rbac.authorization.k8s.io", "kind": "ClusterRole", "name": "f5g-otel"}, "subjects": [{"kind": "ServiceAccount", "name": "otel", "namespace": "f5g-telemetry"}]}
---
{"apiVersion": "v1", "kind": "ConfigMap", "metadata": {"name": "otel-agent", "namespace": "f5g-telemetry"}, "data": {"config.yaml": "# Per-node agent (DaemonSet): container logs of the testbed namespaces + this node's kubelet\n# cAdvisor metrics. Pushes straight to the storage tier; every record carries run.id.\nreceivers:\n  filelog:\n    include: [/var/log/pods/f5g_*/*/*.log, /var/log/pods/f5g-telemetry_*/*/*.log]\n    start_at: end\n    include_file_path: true\n    operators:\n      - type: container          # CRI format; adds k8s.namespace/pod/container from the path\n        add_metadata_from_filepath: true\n  prometheus:\n    config:\n      scrape_configs:\n        - job_name: cadvisor\n          scrape_interval: 5s\n          scheme: https\n          tls_config: { insecure_skip_verify: true }\n          authorization: { credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token }\n          metrics_path: /metrics/cadvisor\n          static_configs: [{ targets: [\"${env:NODE_IP}:10250\"] }]\n          metric_relabel_configs:\n            - { source_labels: [namespace], regex: \"f5g.*\", action: keep }\n          relabel_configs:\n            - { target_label: node, replacement: \"${env:NODE_NAME}\" }\n\nprocessors:\n  batch: {}\n  resource/run:\n    attributes:\n      - { key: run.id, value: \"${env:RUN_ID}\", action: upsert }\n      - { key: k8s.node.name, value: \"${env:NODE_NAME}\", action: upsert }\n  transform/logs:\n    error_mode: ignore\n    log_statements:\n      - context: resource\n        statements:\n          - set(attributes[\"service.name\"], attributes[\"k8s.container.name\"])\n      - context: log\n        statements:\n          - replace_pattern(body, \"\\\\x1b\\\\[[0-9;]*m\", \"\")\n\nexporters:\n  otlphttp/loki:\n    endpoint: http://${env:STORE_HOST}:3100/otlp\n  prometheusremotewrite:\n    endpoint: http://${env:STORE_HOST}:9090/api/v1/write\n    external_labels: { run_id: \"${env:RUN_ID}\" }\n\nservice:\n  pipelines:\n    logs:\n      receivers: [filelog]\n      processors: [transform/logs, resource/run, batch]\n      exporters: [otlphttp/loki]\n    metrics:\n      receivers: [prometheus]\n      processors: [batch]\n      exporters: [prometheusremotewrite]\n"}}
---
{"apiVersion": "v1", "kind": "ConfigMap", "metadata": {"name": "otel-gateway", "namespace": "f5g-telemetry"}, "data": {"config.yaml": "# Cluster gateway (one replica, telemetry node): OTLP traces from the NFs, Kubernetes events\n# (a first-class modality: probe failures, restarts, rescheduling), cluster object state, and\n# the NFs' own /metrics (pods annotated f5g/scrape=true). Pushes to the storage tier.\nreceivers:\n  otlp:\n    protocols:\n      grpc: { endpoint: 0.0.0.0:4317 }\n  k8sobjects:\n    objects:\n      - name: events\n        mode: watch\n        namespaces: [f5g, f5g-telemetry]\n  k8s_cluster:\n    collection_interval: 5s\n    node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]\n    allocatable_types_to_report: [cpu, memory]\n  prometheus:\n    config:\n      scrape_configs:\n        - job_name: f5g-pods\n          scrape_interval: 5s\n          kubernetes_sd_configs:\n            - role: pod\n              namespaces: { names: [f5g, f5g-telemetry] }\n          relabel_configs:\n            - { source_labels: [__meta_kubernetes_pod_annotation_f5g_scrape], regex: \"true\", action: keep }\n            - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_f5g_metrics_port]\n              regex: \"(.+);(.+)\"\n              replacement: \"$${1}:$${2}\"\n              target_label: __address__\n            - { source_labels: [__meta_kubernetes_pod_label_app], target_label: nf }\n            - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }\n            - { source_labels: [__meta_kubernetes_pod_node_name], target_label: node }\n\nprocessors:\n  batch: {}\n  resource/run:\n    attributes:\n      - { key: run.id, value: \"${env:RUN_ID}\", action: upsert }\n  transform/events:\n    error_mode: ignore\n    log_statements:\n      - context: resource\n        statements:\n          - set(attributes[\"service.name\"], \"k8s-events\")\n\nexporters:\n  otlp/tempo:\n    endpoint: ${env:STORE_HOST}:14317\n    tls: { insecure: true }\n  otlphttp/loki:\n    endpoint: http://${env:STORE_HOST}:3100/otlp\n  prometheusremotewrite:\n    endpoint: http://${env:STORE_HOST}:9090/api/v1/write\n    external_labels: { run_id: \"${env:RUN_ID}\" }\n    resource_to_telemetry_conversion: { enabled: true }\n\nservice:\n  pipelines:\n    traces:\n      receivers: [otlp]\n      processors: [resource/run, batch]\n      exporters: [otlp/tempo]\n    logs/events:\n      receivers: [k8sobjects]\n      processors: [transform/events, resource/run, batch]\n      exporters: [otlphttp/loki]\n    metrics/nf:\n      receivers: [prometheus]\n      processors: [batch]\n      exporters: [prometheusremotewrite]\n    metrics/cluster:\n      receivers: [k8s_cluster]\n      processors: [batch]\n      exporters: [prometheusremotewrite]\n"}}
---
{"apiVersion": "apps/v1", "kind": "DaemonSet", "metadata": {"name": "otel-agent", "namespace": "f5g-telemetry"}, "spec": {"selector": {"matchLabels": {"app": "otel-agent"}}, "template": {"metadata": {"labels": {"app": "otel-agent"}}, "spec": {"serviceAccountName": "otel", "tolerations": [{"operator": "Exists"}], "volumes": [{"name": "conf", "configMap": {"name": "otel-agent"}}, {"name": "pods", "hostPath": {"path": "/var/log/pods"}}], "containers": [{"name": "otelcol", "image": "otel/opentelemetry-collector-contrib:0.120.0", "imagePullPolicy": "Never", "args": ["--config=/conf/config.yaml"], "env": [{"name": "RUN_ID", "value": "m1b-logtime4"}, {"name": "STORE_HOST", "value": "172.22.0.1"}, {"name": "NODE_IP", "valueFrom": {"fieldRef": {"fieldPath": "status.hostIP"}}}, {"name": "NODE_NAME", "valueFrom": {"fieldRef": {"fieldPath": "spec.nodeName"}}}], "volumeMounts": [{"name": "conf", "mountPath": "/conf"}, {"name": "pods", "mountPath": "/var/log/pods", "readOnly": true}], "securityContext": {"runAsUser": 0}}]}}}}
---
{"apiVersion": "apps/v1", "kind": "Deployment", "metadata": {"name": "otel-gateway", "namespace": "f5g-telemetry", "labels": {"app": "otel-gateway"}}, "spec": {"replicas": 1, "strategy": {"type": "Recreate"}, "selector": {"matchLabels": {"app": "otel-gateway"}}, "template": {"metadata": {"labels": {"app": "otel-gateway"}, "annotations": {}}, "spec": {"serviceAccountName": "otel", "nodeSelector": {"role": "telemetry"}, "volumes": [{"name": "conf", "configMap": {"name": "otel-gateway"}}], "containers": [{"name": "otelcol", "image": "otel/opentelemetry-collector-contrib:0.120.0", "imagePullPolicy": "Never", "args": ["--config=/conf/config.yaml"], "env": [{"name": "RUN_ID", "value": "m1b-logtime4"}, {"name": "STORE_HOST", "value": "172.22.0.1"}, {"name": "NODE_IP", "valueFrom": {"fieldRef": {"fieldPath": "status.hostIP"}}}, {"name": "NODE_NAME", "valueFrom": {"fieldRef": {"fieldPath": "spec.nodeName"}}}], "volumeMounts": [{"name": "conf", "mountPath": "/conf"}]}]}}}}
---
{"apiVersion": "v1", "kind": "Service", "metadata": {"name": "otel-gateway", "namespace": "f5g-telemetry"}, "spec": {"selector": {"app": "otel-gateway"}, "ports": [{"name": "otlp", "port": 4317}]}}
---
{"apiVersion": "apps/v1", "kind": "Deployment", "metadata": {"name": "node-exporter", "namespace": "f5g-telemetry", "labels": {"app": "node-exporter"}}, "spec": {"replicas": 1, "strategy": {"type": "Recreate"}, "selector": {"matchLabels": {"app": "node-exporter"}}, "template": {"metadata": {"labels": {"app": "node-exporter"}, "annotations": {"f5g/scrape": "true", "f5g/metrics-port": "9100"}}, "spec": {"nodeSelector": {"role": "telemetry"}, "hostPID": true, "volumes": [{"name": "root", "hostPath": {"path": "/"}}], "containers": [{"name": "node-exporter", "image": "prom/node-exporter:v1.8.2", "imagePullPolicy": "Never", "args": ["--path.rootfs=/host"], "volumeMounts": [{"name": "root", "mountPath": "/host", "readOnly": true}]}]}}}}