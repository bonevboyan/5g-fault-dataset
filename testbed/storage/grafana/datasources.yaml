apiVersion: 1
datasources:
  - { name: Prometheus, uid: prom, type: prometheus, url: http://prometheus:9090, isDefault: true }
  - { name: Loki, uid: loki, type: loki, url: http://loki:3100 }
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2: { datasourceUid: loki, filterByTraceID: false, spanStartTimeShift: -1m, spanEndTimeShift: 1m }
